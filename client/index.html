<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="description" content="Connect a public GitHub repository, ask in plain English, and get answers whose citations open the exact lines of code." />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="Codebase Intellisense — Ask the repo. Get the line." />
    <meta property="og:description" content="Precise codebase Q&A grounded in AST symbols and verified line-level citations." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Codebase Intellisense — Ask the repo. Get the line." />
    <meta name="twitter:description" content="Connect a public GitHub repository, ask in plain English, and get answers whose citations open the exact lines of code." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Codebase Intellisense — Ask the repo. Get the line.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ci-theme') || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F6F4EF');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
