services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codebase_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codebase_intellisense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codebase_intellisense}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codebase_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?set it}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?set it} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: codebase_server
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      ENABLE_DEV_LOGIN: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set it}@postgres:5432/${POSTGRES_DB:-codebase_intellisense}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: codebase_worker
    restart: always
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      ENABLE_DEV_LOGIN: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set it}@postgres:5432/${POSTGRES_DB:-codebase_intellisense}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.indexing_worker

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set it}
    container_name: codebase_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
